name: ci

on:
  push:
    branches: [main] # use your default branch name
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: booking
          POSTGRES_PASSWORD: booking
          POSTGRES_DB: booking
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U booking"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://booking:booking@localhost:5432/booking
      TEST_DATABASE_URL: postgresql+psycopg://booking:booking@localhost:5432/booking_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Type check application
        run: mypy app
      - name: Compile Python sources
        run: python -m compileall -q app migrations tests
      - name: Create the test database
        env:
          PGPASSWORD: booking
        run: psql -h localhost -U booking -d booking -v ON_ERROR_STOP=1 -c "CREATE DATABASE booking_test"
      - name: Migrations apply cleanly on an empty database
        run: alembic upgrade head
      - name: Tests (domain, API contract, constraints, concurrency)
        run: pytest -q

  compose-smoke:
    runs-on: ubuntu-24.04
    needs: checks
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare local environment
        run: cp .env.example .env
      - name: Start the stack
        run: docker compose up -d --build
      - name: The API answers
        run: curl -fsS --retry 30 --retry-delay 2 --retry-connrefused http://localhost:8080/readyz
      - name: Show logs on failure
        if: failure()
        run: |
          docker compose ps -a
          echo "=== api ==="
          docker compose logs --no-color --tail 200 api
          echo "=== migrate ==="
          docker compose logs --no-color --tail 100 migrate
          echo "=== api health ==="
          docker inspect --format '{{json .State.Health}}' court-service-local-api-1 || true
      - name: Stop the stack
        if: always()
        run: docker compose down -v
