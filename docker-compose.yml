name: court-service-local
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: court
      POSTGRES_USER: court
      POSTGRES_PASSWORD: ${DB_PASSWORD:-court-local-password}
    volumes:
      - "court-db:/var/lib/postgresql/data"
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U court -d court"]
      interval: 5s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${REDIS_PASSWORD:-local-redis-password}",
      ]
    volumes: ["court-redis:/data"]
    healthcheck:
      test: ["CMD", "sh", "-c", "redis-cli -a '$$REDIS_PASSWORD' ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-local-redis-password}
  kafka:
    image: apache/kafka:3.9.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 10s
      retries: 20
  migrate:
    build: .
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://court:${DB_PASSWORD:-court-local-password}@db:5432/court
      REDIS_URL: redis://:${REDIS_PASSWORD:-local-redis-password}@redis:6379/0
    command: ["sh", "-c", "alembic upgrade head && python -m app.seed"]
    depends_on:
      db: { condition: service_healthy }
  api:
    build: .
    restart: unless-stopped
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://court:${DB_PASSWORD:-court-local-password}@db:5432/court
      REDIS_URL: redis://:${REDIS_PASSWORD:-local-redis-password}@redis:6379/0
      APP_BASE_URL: http://localhost:8080
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    command: ["uvicorn", "app.api:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
    expose: ["8000"]
  worker:
    build: .
    restart: unless-stopped
    stop_grace_period: 30s
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://court:${DB_PASSWORD:-court-local-password}@db:5432/court
      REDIS_URL: redis://:${REDIS_PASSWORD:-local-redis-password}@redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    command: ["python", "-m", "app.worker"]
    healthcheck:
      disable: true
    depends_on:
      migrate: { condition: service_completed_successfully }
      kafka: { condition: service_healthy }
  web:
    image: nginx:1.28-alpine
    restart: unless-stopped
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/proxy_params:/etc/nginx/proxy_params:ro
    ports: ["127.0.0.1:8080:80"]
    depends_on: [api]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/healthz >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 10
  test-db:
    profiles: ["test"]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: court_test
      POSTGRES_USER: court
      POSTGRES_PASSWORD: court
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U court -d court_test"]
      interval: 5s
      timeout: 3s
      retries: 20
  tests:
    profiles: ["test"]
    build:
      context: .
      target: test
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://court:court@test-db:5432/court_test
    depends_on:
      test-db: { condition: service_healthy }
  prometheus:
    image: prom/prometheus:v3.16.0
    restart: unless-stopped
    command:
      [
        "--config.file=/etc/prometheus/prometheus.yml",
        "--storage.tsdb.path=/prometheus",
        "--storage.tsdb.retention.time=3d",
      ]
    volumes:
      - ./deploy/monitoring/prometheus/local.yml:/etc/prometheus/prometheus.yml:ro
      - court-prometheus:/prometheus
    ports: ["127.0.0.1:9090:9090"]
  loki:
    image: grafana/loki:3.7.8
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./deploy/monitoring/loki/config.yml:/etc/loki/config.yml:ro
      - court-loki:/loki
    ports: ["127.0.0.1:3100:3100"]
  alloy:
    image: grafana/alloy:v1.22.0
    user: "0:0"
    restart: unless-stopped
    command:
      [
        "run",
        "--server.http.listen-addr=0.0.0.0:12345",
        "--storage.path=/var/lib/alloy",
        "--disable-reporting",
        "/etc/alloy/config.alloy",
      ]
    environment:
      LOKI_HOST: loki:3100
    volumes:
      - ./deploy/monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - court-alloy:/var/lib/alloy
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/log:/var/log:ro
    depends_on: [loki]
  grafana:
    image: grafana/grafana:13.3.1
    restart: unless-stopped
    env_file: [.env]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-LocalOnly-Grafana-ChangeMe-123!}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - court-grafana:/var/lib/grafana
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [prometheus, loki]
volumes:
  court-db:
  court-redis:
  court-prometheus:
  court-loki:
  court-grafana:
  court-alloy:
