name: court-booking

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
      POSTGRES_DB: booking
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d booking"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Applies migrations, then loads one demo venue. Runs to completion and exits.
  migrate:
    build:
      context: .
      target: base
    command: ["sh", "-c", "alembic upgrade head && python -m app.seed"]
    environment:
      DATABASE_URL: postgresql+psycopg://booking:booking@db:5432/booking
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      target: base
    environment:
      DATABASE_URL: postgresql+psycopg://booking:booking@db:5432/booking
      STAFF_KEY: ${STAFF_KEY:-dev-staff-key}
      DB_POOL_SIZE: "10"
      DB_MAX_OVERFLOW: "10"
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/readyz', timeout=2).status == 200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Run on demand: docker compose --profile test run --rm tests
  tests:
    profiles: ["test"]
    build:
      context: .
      target: test
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://booking:booking@db:5432/booking_test
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
