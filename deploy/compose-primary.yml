name: court-service
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: court
      POSTGRES_USER: court
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ${DATA_DIR:-/srv/court-data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U court -d court"]
      interval: 5s
      timeout: 3s
      retries: 30
    ports:
      - "${NODE_PRIVATE_IP}:5432:5432"
    networks: [court]
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - ${DATA_DIR:-/srv/court-data}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    ports:
      - "${NODE_PRIVATE_IP}:6379:6379"
    networks: [court]
  api:
    build: { context: .., dockerfile: Dockerfile }
    restart: unless-stopped
    env_file: [./api.env]
    environment:
      DATABASE_URL: postgresql+psycopg://court:${DB_PASSWORD}@db:5432/court
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    command: ["uvicorn", "app.api:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1", "--forwarded-allow-ips", "*"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["${NODE_PRIVATE_IP}:8000:8000"]
    networks: [court]
  worker:
    build: { context: .., dockerfile: Dockerfile }
    restart: unless-stopped
    env_file: [./worker.env]
    environment:
      DATABASE_URL: postgresql+psycopg://court:${DB_PASSWORD}@db:5432/court
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    command: ["python", "-m", "app.worker"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [court]
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    restart: unless-stopped
    environment:
      DATA_SOURCE_URI: db:5432/court?sslmode=disable
      DATA_SOURCE_USER: court
      DATA_SOURCE_PASS: ${DB_PASSWORD}
    ports: ["${NODE_PRIVATE_IP}:9187:9187"]
    depends_on: [db]
    networks: [court]
  redis-exporter:
    image: oliver006/redis_exporter:v1.93.0
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports: ["${NODE_PRIVATE_IP}:9121:9121"]
    depends_on: [redis]
    networks: [court]
  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.12.1
    restart: unless-stopped
    pid: host
    command: ["--path.rootfs=/host"]
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave
    ports: ["${NODE_PRIVATE_IP}:9100:9100"]
    networks: [court]
  alloy:
    image: grafana/alloy:v1.22.0
    user: "0:0"
    restart: unless-stopped
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "--storage.path=/var/lib/alloy", "--disable-reporting", "/etc/alloy/config.alloy"]
    environment:
      LOKI_HOST: ${SECONDARY_PRIVATE_IP}:3100
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ${DATA_DIR:-/srv/court-data}/alloy:/var/lib/alloy
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/log:/var/log:ro
    networks: [court]
  web:
    image: nginx:1.28-alpine
    restart: unless-stopped
    volumes:
      - ../frontend:/usr/share/nginx/html:ro
      - ../nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../nginx/proxy_params:/etc/nginx/proxy_params:ro
    ports: ["80:80"]
    depends_on: [api]
    networks: [court]
networks:
  court: { driver: bridge }
