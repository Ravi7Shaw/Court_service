global:
  scrape_interval: 15s
  evaluation_interval: 15s
scrape_configs:
  - job_name: court-api
    metrics_path: /metrics
    static_configs:
      - targets: ["${PRIMARY_PRIVATE_IP}:8000", "${SECONDARY_PRIVATE_IP}:8000"]
  - job_name: node-exporter
    static_configs:
      - targets: ["${PRIMARY_PRIVATE_IP}:9100", "${SECONDARY_PRIVATE_IP}:9100"]
  - job_name: postgres-exporter
    static_configs:
      - targets: ["${PRIMARY_PRIVATE_IP}:9187"]
  - job_name: redis-exporter
    static_configs:
      - targets: ["${PRIMARY_PRIVATE_IP}:9121"]
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]
