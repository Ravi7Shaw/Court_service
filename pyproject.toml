[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "court-booking"
version = "2.0.0"
description = "Court booking platform with auth, payments simulation, notifications, Redis, and observability."
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.121.0",
    "uvicorn[standard]>=0.38.0",
    "sqlalchemy>=2.0.44",
    "psycopg[binary]>=3.2.12",
    "alembic>=1.17.0",
    "pydantic[email]>=2.12.0",
    "pyjwt>=2.10.1",
    "argon2-cffi>=25.1.0",
    "redis>=6.4.0",
    "prometheus-client>=0.23.1",
    "confluent-kafka>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.2",
    "httpx>=0.28.1",
    "ruff>=0.14.0",
    "mypy>=1.18.2",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"app/api.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:starlette.*"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
