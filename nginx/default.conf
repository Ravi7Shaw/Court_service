map $http_x_forwarded_proto $court_hsts { default ""; https "max-age=31536000"; }
set_real_ip_from 10.42.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=8r/m;
upstream court_api { server api:8000; keepalive 32; }
server {
    listen 80;
    server_name _;
    server_tokens off;
    limit_req_status 429;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 2m;
    add_header Strict-Transport-Security $court_hsts always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
    add_header Cache-Control "no-cache" always;

    # Swagger uses its own external distribution; keep the application CSP strict.
    location = /docs {
        add_header Content-Security-Policy "default-src 'none'; script-src https://cdn.jsdelivr.net 'unsafe-inline'; style-src https://cdn.jsdelivr.net 'unsafe-inline'; img-src https://fastapi.tiangolo.com data:; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
        add_header Strict-Transport-Security $court_hsts always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        proxy_pass http://court_api;
        include /etc/nginx/proxy_params;
    }
    location = /metrics { return 404; }

    location = /api/auth/register { limit_req zone=auth_limit burst=4 nodelay; proxy_pass http://court_api; include /etc/nginx/proxy_params; }
    location = /api/auth/login { limit_req zone=auth_limit burst=4 nodelay; proxy_pass http://court_api; include /etc/nginx/proxy_params; }
    location = /api/auth/verify-email { limit_req zone=auth_limit burst=4 nodelay; proxy_pass http://court_api; include /etc/nginx/proxy_params; }
    location /api/ { proxy_pass http://court_api; include /etc/nginx/proxy_params; }
    location ~ ^/(holds|bookings|courts|recurring-bookings|staff|healthz|readyz|metrics|docs|openapi.json)(/|$) {
        proxy_pass http://court_api;
        include /etc/nginx/proxy_params;
    }
    location / { try_files $uri $uri/ /index.html; }
}
